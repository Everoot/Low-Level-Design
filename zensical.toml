[project]
site_name = "Low-Level Design"
site_url = "https://everoot.github.io/Low-Level-Design/"
site_description = "Popular low-level design problems: derive data structures and APIs from constraints"
site_author = "LLD Notes"
copyright = "Made with Everoot"
repo_url = "https://github.com/Everoot/Low-Level-Design"
repo_name = "Everoot/Low-Level-Design"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
nav = [
  { "Home" = "index.md" },
  { "Hash Maps" = [
    { "146 · LRU Cache" = "problems/146-lru-cache.md" },
    { "380 · Insert Delete GetRandom O(1)" = "problems/380-randomized-set.md" },
    { "981 · Time Based Key-Value Store" = "problems/981-time-map.md" },
  ] },
  { "Trees & Heaps" = [
    { "295 · Median from Data Stream" = "problems/295-median-finder.md" },
    { "211 · Add and Search Words" = "problems/211-word-dictionary.md" },
  ] },
  { "Queues & Arrays" = [
    { "933 · Number of Recent Calls" = "problems/933-recent-counter.md" },
    { "1603 · Design Parking System" = "problems/1603-parking-system.md" },
  ] },
]
[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "content.code.annotate",
  "search.suggest",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
generator = false

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
