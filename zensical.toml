[project]
site_name = "Low-Level Design"
site_url = "https://everoot.github.io/Low-Level-Design/"
site_description = "Popular low-level design problems: derive data structures and APIs from constraints"
site_author = "LLD Notes"
copyright = "Made with Everoot"
repo_url = "https://github.com/Everoot/Low-Level-Design"
repo_name = "Everoot/Low-Level-Design"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
nav = [
  { "Home" = "index.md" },
  { "Design Problems" = [
    { "Pizza Pricing System" = "problems/Pizza Pricing System/Pizza Pricing System.md" },
    { "Parking Lot" = "problems/Parking Lot/ Parking Lot.md" },
    { "Rate Limiter" = "problems/Rate Limiter/Rate Limiter.md" },
    { "Elevator System" = "problems/Elevator/Elevator.md" },
    { "Locker System" = "problems/Locker/Locker.md" },
  ] },
]
[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "content.code.annotate",
  "search.suggest",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
generator = false

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
